<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
  <title>YoVouch: simulated WhatsApp thread</title>
  <style>
    :root{--ink:#020304;--muted:#545859;--line:#dce0e5;--bg:#f3f6fa;--card:#fff;--accent:#41204b;--tint:#e7d4ed;--bad:#b3261e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.5}
    main{max-width:360px;margin:0 auto;padding:12px 16px}
    .phone{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
    .top{background:var(--accent);color:#fff;padding:12px 16px;font-weight:700}
    #log{list-style:none;margin:0;padding:12px;min-height:240px;display:flex;flex-direction:column;gap:8px}
    #log li{max-width:85%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
    #log .in{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
    #log .out{align-self:flex-end;background:var(--tint)}
    #log .note{align-self:center;max-width:100%;color:var(--muted);font-size:13px;padding:0}
    #log .bad{color:var(--bad)}
    .kb{display:block;font-size:12px;color:var(--muted);margin-top:4px}
    form{padding:12px;border-top:1px solid var(--line)}
    label{display:block;font-size:14px;margin-bottom:8px}
    input,textarea{display:block;width:100%;font:inherit;min-height:44px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:4px}
    button{font:inherit;min-height:44px;min-width:44px;padding:8px 16px;border:0;border-radius:22px;background:var(--accent);color:#fff;cursor:pointer;margin:4px 4px 0 0}
    button.alt{background:var(--tint);color:var(--accent)}
    .small{font-size:13px;color:var(--muted)}
    footer{max-width:360px;margin:16px auto;padding:0 16px;font-size:13px;color:var(--muted)}
  </style>
  <script src="thread.js" defer></script>
</head>
<body>
<main>
  <p class="small">Simulated WhatsApp. No message was sent.</p>
  <div class="phone">
    <div class="top">YoVouch</div>
    <ol id="log" aria-live="polite" aria-label="Messages"></ol>
    <form id="send">
      <label>Sample number<input id="from" name="from" type="tel" autocomplete="off" required maxlength="20" placeholder="0825550131"></label>
      <label>Paste a post, or type your answer<textarea id="text" name="text" rows="3" maxlength="2000" required></textarea></label>
      <button>Send</button><button type="button" id="rec" class="alt" hidden>Record</button>
    </form>
  </div>
  <p class="small">Each message shows its size in KB. A WhatsApp text is about 1 KB each way.</p>
</main>
<footer><p>Who can see this: anyone with the link</p><p>Student prototype. Not operated by Yoma or UNICEF. Record signed by YoCard, not by Yoma.</p></footer>
</body>
</html>
